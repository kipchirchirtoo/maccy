<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75142a"/>
      <stop offset="50%" stop-color="#5a0e1f"/>
      <stop offset="100%" stop-color="#24040b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf5db"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#burgundyGrad)"/>
  <!-- Decorative Maasai beadwork geometric rim -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Crown / Motif Top -->
  <path d="M 230 140 L 256 120 L 282 140 L 256 150 Z" fill="url(#goldGrad)"/>
  
  <!-- Stylized Elegant 'M' Monogram -->
  <path d="M 160 350 L 160 190 L 256 310 L 352 190 L 352 350" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Subtle African needle & thread accent -->
  <circle cx="256" cy="385" r="8" fill="url(#goldGrad)"/>
  <text x="256" y="425" text-anchor="middle" fill="#eedb94" font-family="'Georgia', serif" font-size="28" font-weight="bold" letter-spacing="4">MACCY</text>
  <text x="256" y="450" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="6">COLLECTIONS</text>
</svg>
